framework:
    rate_limiter:
        # The password reset form sends an email to somebody else's inbox on
        # request, which makes it the one unauthenticated route on this site that
        # can be turned into a way of bothering a third party. The limit protects
        # the person whose address is being used, not the one asking.
        #
        # Five an hour is generous for somebody who has genuinely forgotten a
        # password and mistyped their address twice, and useless to anybody
        # trying to use this CMS as a mail relay.
        password_reset:
            policy: 'sliding_window'
            limit: 5
            interval: '1 hour'

        # Searching, by either route.
        #
        # One bucket for `/search` and `/search/suggestions` together, because
        # they are the same work: a PostgreSQL full-text match over the article
        # and page tables. An audit found the first version limiting only the
        # suggestions — on the reasoning that typing asks repeatedly — while
        # `/search` was unlimited and *more* expensive per request, twenty-one
        # rows against six. A ceiling that is bypassed by walking one route to
        # the left is not a ceiling.
        #
        # Sixty a minute is far past a person: the browser debounces, so typing a
        # word costs one or two, and submitting costs one. Somebody scripting it
        # finds a wall.
        #
        # **The key is the client address**, so this control is only as accurate
        # as `framework.trusted_proxies`. Behind a proxy with that unset, every
        # visitor arrives as the proxy and shares one allowance; set too widely,
        # `X-Forwarded-For` becomes attacker-controlled and there is no limit at
        # all. See docs/setup.md.
        search:
            policy: 'sliding_window'
            limit: 60
            interval: '1 minute'

when@test:
    framework:
        rate_limiter:
            password_reset:
                policy: 'sliding_window'
                # Deliberately higher in tests than in production. The counters
                # are shared within a kernel, and a suite that signs in and
                # resets repeatedly would otherwise exhaust an allowance meant
                # for one person — the same problem feature 008 solved for
                # sign-in throttling, and the same reasoning.
                #
                # The test that proves the limit exists reaches it by asking
                # this many times.
                limit: 5
                interval: '1 hour'

            # Low enough that a test can reach it without sixty requests, which
            # would make the suite slower to prove the same thing.
            search:
                policy: 'sliding_window'
                limit: 5
                interval: '1 minute'
