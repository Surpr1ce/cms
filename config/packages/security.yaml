security:
    password_hashers:
        Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface: 'auto'

    providers:
        # The skeleton's users_in_memory provider is gone. Accounts live in the
        # database, and an in-memory provider left behind is an account list
        # nobody maintains.
        accounts:
            entity:
                class: App\Entity\User
                property: email

    firewalls:
        dev:
            pattern: ^/(_profiler|_wdt|assets|build)/
            security: false

        main:
            lazy: true
            provider: accounts

            form_login:
                login_path: login
                check_path: login
                enable_csrf: true
                # Where somebody lands when they signed in without having been
                # sent anywhere. If they were, Symfony returns them there
                # instead — FR-007.
                default_target_path: admin_dashboard

            # FR-001 to FR-006. Nothing counted attempts before this; the
            # administration area being closed invited the assumption that it
            # was also guarded, and it was not.
            #
            # `max_attempts` is per client address *and* per submitted handle —
            # Symfony keeps two limiters and consults both. The per-handle one
            # is what stops this becoming a denial-of-service tool: without it,
            # exhausting the allowance against any address would lock out every
            # editor behind the same network.
            #
            # The check runs before the password is compared, so the refusal is
            # a refusal to try rather than a recorded failure. That distinction
            # is what SignInThrottlingTest's correct-password case proves.
            login_throttling:
                max_attempts: 5
                interval: '15 minutes'

            logout:
                path: logout
                target: home

    access_control:
        # The public site, explicitly. Listed before the administration rule so
        # that a future /admin-looking public address cannot be closed by
        # accident.
        - { path: ^/login$, roles: PUBLIC_ACCESS }

        # Getting back in has to be reachable by somebody who cannot sign in —
        # which is the entire point of it, and would be a contradiction behind
        # the firewall.
        - { path: ^/reset-password, roles: PUBLIC_ACCESS }

        # Everything under /admin needs somebody signed in who holds at least one
        # content role. A list here means *any* of them, which matters because
        # there is no role hierarchy: an administrator holds ROLE_ADMIN and does
        # not implicitly hold ROLE_AUTHOR, so naming only the latter would lock
        # administrators out of their own administration area.
        #
        # This is the coarse gate and it is all it should be. What a signed-in
        # person may do to a particular article is a voter's question, not this
        # file's.
        - { path: ^/admin, roles: [ROLE_AUTHOR, ROLE_EDITOR, ROLE_ADMIN] }

# Roles are NOT arranged in a hierarchy here, deliberately. An administrator is
# granted an editor's permissions by the voters in src/Security/, where the grant
# is visible at the point of use and provable in a unit test. See
# docs/adr/0009-voters-instead-of-role-hierarchy.md.

when@test:
    security:
        password_hashers:
            # Hashing is expensive by design. In tests that cost buys nothing,
            # and a suite that signs in repeatedly pays it repeatedly.
            Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface:
                algorithm: auto
                cost: 4
                time_cost: 3
                memory_cost: 10
