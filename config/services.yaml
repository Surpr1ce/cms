# yaml-language-server: $schema=../vendor/symfony/dependency-injection/Loader/schema/services.schema.json

# This file is the entry point to configure your own services.
# Files in the packages/ subdirectory configure your dependencies.
# See also https://symfony.com/doc/current/service_container/import.html

# Put parameters here that don't need to change on each machine where the app is deployed
# https://symfony.com/doc/current/best_practices.html#use-parameters-for-application-configuration
parameters:
    # Shown in the header, the footer and every page title. A parameter rather
    # than a hard-coded string so that the one place it lives is obvious; it
    # becomes a setting the moment somebody needs to change it without a deploy.
    app.site_name: 'CMS'

    # Articles per listing page. Conventional, and cheap to change — the
    # pagination boundaries are covered by unit tests that do not depend on it.
    app.articles_per_page: 20

    # Where uploaded files live. Outside public/, which is the point: no web
    # server configuration can serve these bytes directly, so nothing that ends
    # up here will ever be executed.
    app.upload_directory: '%kernel.project_dir%/var/uploads'

    # 8 MB — comfortably a photograph, and small enough that a refusal is cheap.
    # Stated in one place so the upload form can show the same number it enforces.
    app.upload_max_bytes: 8388608

services:
    # default configuration for services in *this* file
    _defaults:
        autowire: true      # Automatically injects dependencies in your services.
        autoconfigure: true # Automatically registers your services as commands, event subscribers, etc.

    # makes classes in src/ available to be used as services
    # this creates a service per class whose id is the fully-qualified class name
    App\:
        resource: '../src/'

    # add more service definitions when explicit configuration is needed
    # please note that last definitions always *replace* previous ones

    # Autowiring cannot guess an int, so the page size is bound explicitly.
    App\Service\Pagination\Paginator:
        arguments:
            $perPage: '%app.articles_per_page%'

    App\Service\Media\MediaStorage:
        arguments:
            $directory: '%app.upload_directory%'

    App\Service\Media\UploadedFileValidator:
        arguments:
            $maximumBytes: '%app.upload_max_bytes%'

    # The form-login authenticator belongs to a firewall rather than to a class,
    # so there is nothing for autowiring to find. PasswordResetController uses it
    # to sign somebody in the moment their new password is stored.
    App\Controller\PasswordResetController:
        arguments:
            $formLogin: '@security.authenticator.form_login.main'
            $passwordResetLimiter: '@limiter.password_reset'
